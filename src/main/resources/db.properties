# MySQL database configuration for the Mesos leaderboard (FA "Classifica DB").
#
# The server connects to the MySQL DBMS at boot, verifies that the database
# named `db.name` exists (creating it empty otherwise), and ensures the
# leaderboard table is in place.
#
# The database name embeds our group identifier (GC45) to avoid collisions
# with other projects sharing the same DBMS:
#       GC45_Mesos_DB
#
# These properties can be overridden via JVM system properties using the same
# keys (e.g. -Ddb.url=... -Ddb.user=... -Ddb.password=... -Ddb.name=...).

# Host and port of the MySQL DBMS (NO database name in the URL: it is appended
# at runtime to the dedicated `db.name` property below).
db.url=jdbc:mysql://localhost:3306/

# Credentials of a MySQL user that has CREATE DATABASE privileges (needed for
# the first-launch initialisation) and full DML privileges on `db.name`.
db.user=root
db.password=root

# Name of the application database. Must contain the group identifier.
db.name=GC45_Mesos_DB
