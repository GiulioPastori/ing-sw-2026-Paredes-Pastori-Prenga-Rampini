  <rect x="35" y="600" width="515" height="300" class="panel"/>
  <text x="55" y="626" class="section-title">CARDS AND EFFECTS</text>

  <rect x="65" y="665" width="125" height="60" class="cards"/>
  <text x="85" y="688" class="box-title">Card</text>
  <text x="85" y="708" class="box-text">abstract base</text>

  <rect x="65" y="775" width="125" height="60" class="cards"/>
  <text x="85" y="798" class="box-title">Character</text>
  <text x="85" y="818" class="box-text">6 concrete types</text>

  <rect x="220" y="775" width="125" height="60" class="cards"/>
  <text x="240" y="798" class="box-title">Building</text>
  <text x="240" y="818" class="box-text">cost, hooks, score</text>

  <rect x="375" y="775" width="125" height="60" class="cards"/>
  <text x="395" y="798" class="box-title">Event</text>
  <text x="395" y="818" class="box-text">strategy based</text>

  <rect x="220" y="855" width="125" height="50" class="cards"/>
  <text x="238" y="878" class="box-title">BuildingEffect</text>
  <text x="238" y="896" class="box-text">hook bundle</text>

  <rect x="375" y="855" width="125" height="50" class="cards"/>
  <text x="393" y="878" class="box-title">EventStrategy</text>
  <text x="393" y="896" class="box-text">event logic</text>

