  <path d="M677 450 L677 485" class="line"/>

  <rect x="905" y="75" width="495" height="500" class="panel"/>
  <text x="925" y="101" class="section-title">NETWORK - SERVER SIDE</text>

  <rect x="930" y="125" width="105" height="60" class="server"/>
  <text x="947" y="148" class="box-title">ServerApp</text>
  <text x="947" y="168" class="box-text">CLI entrypoint</text>

  <rect x="1060" y="125" width="105" height="60" class="server"/>
  <text x="1077" y="148" class="box-title">GameServer</text>
  <text x="1077" y="168" class="box-text">starts transports</text>

  <rect x="1190" y="125" width="170" height="60" class="server"/>
  <text x="1207" y="148" class="box-title">LobbyServer</text>
  <text x="1207" y="168" class="box-text">sessions, nicknames</text>

  <rect x="1060" y="230" width="140" height="75" class="server"/>
  <text x="1077" y="253" class="box-title">GameSession</text>
  <text x="1077" y="273" class="box-text">routes messages</text>
  <text x="1077" y="289" class="box-text">broadcasts events</text>

  <rect x="930" y="230" width="105" height="75" class="server"/>
  <text x="947" y="253" class="box-title">Message</text>
  <text x="947" y="273" class="box-text">JSON protocol</text>
  <text x="947" y="289" class="box-text">Socket + RMI</text>

  <rect x="930" y="355" width="130" height="70" class="server"/>
  <text x="947" y="378" class="box-title">ClientConnection</text>
  <text x="947" y="398" class="box-text">transport adapter</text>

  <rect x="1075" y="355" width="145" height="70" class="server"/>
  <text x="1092" y="378" class="box-title">SocketClientHandler</text>
  <text x="1092" y="398" class="box-text">reader/writer/watchdog</text>

  <rect x="1240" y="355" width="130" height="70" class="server"/>
  <text x="1257" y="378" class="box-title">RmiClientHandler</text>
  <text x="1257" y="398" class="box-text">ClientConnection</text>
  <text x="1257" y="414" class="box-text">RmiPlayerSession</text>

  <rect x="930" y="470" width="175" height="65" class="server"/>
  <text x="947" y="493" class="box-title">RmiServerImpl / RmiServer</text>
  <text x="947" y="513" class="box-text">listSessions, register</text>

  <rect x="1135" y="470" width="225" height="65" class="server"/>
  <text x="1152" y="493" class="box-title">Persistence</text>
  <text x="1152" y="513" class="box-text">DatabaseConfig, Initializer</text>
  <text x="1152" y="529" class="box-text">LeaderboardRepository</text>

