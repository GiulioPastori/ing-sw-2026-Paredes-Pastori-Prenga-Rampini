<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42526e"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, sans-serif; fill: #172b4d; }
      .section-title { font: 700 15px Arial, sans-serif; fill: #172b4d; letter-spacing: .3px; }
      .box-title { font: 700 13px Arial, sans-serif; fill: #172b4d; }
      .box-text { font: 11px Arial, sans-serif; fill: #344563; }
      .label { font: 11px Arial, sans-serif; fill: #42526e; }
      .panel { fill: #f7f8fb; stroke: #c7d1e0; stroke-width: 1.4; rx: 10; }
      .model { fill: #e8f4ff; stroke: #4c9aff; }
      .cards { fill: #eef8ea; stroke: #57a773; }
      .actions { fill: #fff3df; stroke: #f5a623; }
      .observer { fill: #f2ecff; stroke: #8f7ee7; }
      .server { fill: #ffecef; stroke: #de6b82; }
      .client { fill: #eefbf7; stroke: #36b37e; }
      .view { fill: #fff7e6; stroke: #ffab00; }
      .line { fill: none; stroke: #42526e; stroke-width: 1.5; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #42526e; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .soft { fill: none; stroke: #7a869a; stroke-width: 1.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="40" y="34" class="title">Mesos - High-Level UML Overview</text>
  <text x="40" y="54" class="label">Compact architectural diagram: model, actions, observer snapshots, networking, persistence, and views.</text>

  <rect x="35" y="75" width="515" height="500" class="panel"/>
  <text x="55" y="101" class="section-title">MODEL</text>

  <rect x="65" y="125" width="155" height="80" class="model"/>
  <text x="80" y="148" class="box-title">Game</text>
  <text x="80" y="168" class="box-text">state machine</text>
  <text x="80" y="184" class="box-text">executes PlayerAction</text>

  <rect x="245" y="125" width="130" height="70" class="model"/>
  <text x="260" y="148" class="box-title">Board</text>
  <text x="260" y="168" class="box-text">rows, decks, era</text>

  <rect x="405" y="125" width="115" height="70" class="model"/>
  <text x="420" y="148" class="box-title">Player</text>
  <text x="420" y="168" class="box-text">food, PP, tribe</text>

  <rect x="245" y="225" width="130" height="70" class="model"/>
  <text x="260" y="248" class="box-title">OfferTiles</text>
  <text x="260" y="268" class="box-text">OfferTile[*]</text>

  <rect x="405" y="225" width="115" height="70" class="model"/>
  <text x="420" y="248" class="box-title">TurnOrderTile</text>
  <text x="420" y="268" class="box-text">turn positions</text>

  <rect x="65" y="235" width="155" height="70" class="model"/>
  <text x="80" y="258" class="box-title">TileResolutionState</text>
  <text x="80" y="278" class="box-text">active tile slots</text>

  <rect x="65" y="345" width="155" height="60" class="model"/>
  <text x="80" y="368" class="box-title">GameBuilder</text>
  <text x="80" y="388" class="box-text">creates Game</text>

  <rect x="245" y="345" width="130" height="60" class="model"/>
  <text x="260" y="368" class="box-title">CardLoader</text>
  <text x="260" y="388" class="box-text">cards.json</text>

  <rect x="405" y="345" width="115" height="60" class="model"/>
  <text x="420" y="368" class="box-title">Tribe</text>
  <text x="420" y="388" class="box-text">cards owned</text>

