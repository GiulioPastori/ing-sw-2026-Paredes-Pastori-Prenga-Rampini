  <text x="630" y="168" class="box-text">MVC controller</text>
  <text x="630" y="184" class="box-text">handles actions</text>

  <rect x="750" y="125" width="105" height="70" class="actions"/>
  <text x="765" y="148" class="box-title">PlayerAction</text>
  <text x="765" y="168" class="box-text">sealed</text>

  <rect x="615" y="220" width="125" height="50" class="actions"/>
  <text x="630" y="242" class="box-title">ActionValidator</text>
  <text x="630" y="260" class="box-text">rule checks</text>

  <rect x="750" y="220" width="105" height="50" class="actions"/>
  <text x="765" y="242" class="box-title">ValidationResult</text>
  <text x="765" y="260" class="box-text">Ok / Fail</text>

  <path d="M615 160 L550 160" class="line"/>
  <path d="M740 160 L750 160" class="line"/>
  <path d="M677 195 L677 220" class="line"/>
  <path d="M740 245 L750 245" class="line"/>

  <rect x="585" y="325" width="290" height="250" class="panel"/>
  <text x="605" y="351" class="section-title">OBSERVER AND SNAPSHOTS</text>

  <rect x="615" y="385" width="125" height="65" class="observer"/>
  <text x="630" y="408" class="box-title">GameEvent</text>
  <text x="630" y="428" class="box-text">sealed event stream</text>

  <rect x="750" y="385" width="105" height="65" class="observer"/>
  <text x="765" y="408" class="box-title">GameEventListener</text>
  <text x="765" y="428" class="box-text">onEvent()</text>

  <rect x="615" y="485" width="230" height="60" class="observer"/>
