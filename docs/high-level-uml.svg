  <rect x="905" y="600" width="495" height="310" class="panel"/>
  <text x="925" y="626" class="section-title">NETWORK - CLIENT SIDE AND VIEWS</text>

  <rect x="930" y="665" width="105" height="60" class="client"/>
  <text x="947" y="688" class="box-title">ClientApp</text>
  <text x="947" y="708" class="box-text">selects UI/transport</text>

  <rect x="1060" y="665" width="130" height="60" class="client"/>
  <text x="1077" y="688" class="box-title">ClientController</text>
