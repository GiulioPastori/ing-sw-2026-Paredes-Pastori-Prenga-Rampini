  <path d="M980 270 L1015 270" class="line"/>
  <path d="M1150 270 L1185 270" class="line"/>
  <path d="M1320 270 L1345 270" class="line"/>
  <path d="M1160 185 L912 240" class="soft"/>
  <path d="M1008 185 L1252 240" class="soft"/>

  <!-- VIEWS -->
  <rect x="35" y="415" width="320" height="190" class="panel"/>
  <text x="55" y="441" class="section-title">VIEWS</text>

  <rect x="60" y="480" width="115" height="55" class="view"/>
  <text x="78" y="503" class="box-title">GameView</text>
  <text x="78" y="521" class="box-text">view contract</text>

  <rect x="215" y="455" width="115" height="55" class="view"/>
  <text x="233" y="478" class="box-title">TuiView</text>
  <text x="233" y="496" class="box-text">terminal UI</text>

  <rect x="215" y="545" width="115" height="55" class="view"/>
  <text x="233" y="568" class="box-title">JavaFxView</text>
  <text x="233" y="586" class="box-text">GUI controllers</text>

  <path d="M175 508 L215 482" class="line"/>
  <path d="M175 508 L215 572" class="line"/>

  <!-- CARDS AND EFFECTS -->
  <rect x="385" y="415" width="380" height="380" class="panel"/>
  <text x="405" y="441" class="section-title">CARDS AND EFFECTS</text>

  <rect x="420" y="485" width="105" height="55" class="cards"/>
  <text x="440" y="508" class="box-title">Card</text>
  <text x="440" y="526" class="box-text">abstract base</text>

  <rect x="585" y="485" width="105" height="55" class="cards"/>
  <text x="603" y="508" class="box-title">CardLoader</text>
  <text x="603" y="526" class="box-text">cards.json</text>

  <rect x="420" y="610" width="105" height="55" class="cards"/>
  <text x="438" y="633" class="box-title">Character</text>
  <text x="438" y="651" class="box-text">6 types</text>

  <rect x="585" y="610" width="105" height="55" class="cards"/>
  <text x="603" y="633" class="box-title">Building</text>
  <text x="603" y="651" class="box-text">hooked effects</text>

  <rect x="585" y="710" width="105" height="55" class="cards"/>
  <text x="603" y="733" class="box-title">BuildingEffect</text>
  <text x="603" y="751" class="box-text">hook bundle</text>

  <rect x="420" y="710" width="105" height="55" class="cards"/>
  <text x="438" y="733" class="box-title">Event</text>
  <text x="438" y="751" class="box-text">EventStrategy</text>

  <path d="M525 512 L585 512" class="line"/>
  <path d="M473 540 L473 610" class="line"/>
  <path d="M525 512 L638 610" class="line"/>
  <path d="M473 540 L473 710" class="line"/>
  <path d="M638 665 L638 710" class="line"/>

  <!-- MODEL AND MVC CORE -->
  <rect x="800" y="415" width="655" height="380" class="panel"/>
  <text x="820" y="441" class="section-title">MODEL AND MVC CORE</text>

  <rect x="835" y="485" width="125" height="60" class="model"/>
  <text x="853" y="508" class="box-title">GameController</text>
  <text x="853" y="527" class="box-text">MVC controller</text>

  <rect x="1010" y="485" width="125" height="60" class="model"/>
  <text x="1028" y="508" class="box-title">Game</text>
  <text x="1028" y="527" class="box-text">state machine</text>

  <rect x="1185" y="485" width="125" height="60" class="model"/>
  <text x="1203" y="508" class="box-title">GameBuilder</text>
  <text x="1203" y="527" class="box-text">creates games</text>

  <rect x="835" y="610" width="125" height="60" class="model"/>
  <text x="853" y="633" class="box-title">PlayerAction</text>
  <text x="853" y="652" class="box-text">sealed actions</text>

  <rect x="1010" y="610" width="125" height="60" class="model"/>
  <text x="1028" y="633" class="box-title">ActionValidator</text>
  <text x="1028" y="652" class="box-text">rule checks</text>

  <rect x="1185" y="610" width="125" height="60" class="model"/>
  <text x="1203" y="633" class="box-title">ValidationResult</text>
  <text x="1203" y="652" class="box-text">Ok / Fail</text>

  <rect x="835" y="730" width="125" height="60" class="model"/>
  <text x="853" y="753" class="box-title">Board</text>
  <text x="853" y="772" class="box-text">rows, tiles, decks</text>

  <rect x="1010" y="730" width="125" height="60" class="model"/>
  <text x="1028" y="753" class="box-title">OfferTiles</text>
  <text x="1028" y="772" class="box-text">offer track</text>

  <rect x="1185" y="730" width="125" height="60" class="model"/>
  <text x="1203" y="753" class="box-title">Player / Tribe</text>
  <text x="1203" y="772" class="box-text">resources, cards</text>

  <path d="M1252 300 L1395 300 L1395 405" class="line"/>
  <text x="1262" y="390" class="label">routes actions to MVC core</text>
