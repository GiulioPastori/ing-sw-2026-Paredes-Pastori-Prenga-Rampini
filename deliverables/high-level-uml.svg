<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344563"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, sans-serif; fill: #172b4d; }
      .subtitle { font: 12px Arial, sans-serif; fill: #5e6c84; }
      .section-title { font: 700 15px Arial, sans-serif; fill: #172b4d; }
      .box-title { font: 700 13px Arial, sans-serif; fill: #172b4d; }
      .box-text { font: 11px Arial, sans-serif; fill: #344563; }
      .label { font: 11px Arial, sans-serif; fill: #42526e; }
      .panel { fill: #f7f8fb; stroke: #c7d1e0; stroke-width: 1.3; rx: 10; }
      .client { fill: #eafaf4; stroke: #36b37e; stroke-width: 1.3; }
      .transport { fill: #fff7e6; stroke: #ffab00; stroke-width: 1.3; }
      .server { fill: #ffecef; stroke: #de6b82; stroke-width: 1.3; }
      .model { fill: #e8f4ff; stroke: #4c9aff; stroke-width: 1.3; }
      .cards { fill: #eef8ea; stroke: #57a773; stroke-width: 1.3; }
      .observer { fill: #f2ecff; stroke: #8f7ee7; stroke-width: 1.3; }
      .persist { fill: #f4f5f7; stroke: #7a869a; stroke-width: 1.3; }
      .view { fill: #fff3df; stroke: #f5a623; stroke-width: 1.3; }
      .line { fill: none; stroke: #344563; stroke-width: 1.6; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #344563; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .soft { fill: none; stroke: #7a869a; stroke-width: 1.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="40" y="34" class="title">Mesos - High-Level UML Overview</text>
  <text x="40" y="54" class="subtitle">Compact architecture diagram for the final delivery. The generated class-level UML remains the detailed reference.</text>

  <!-- NETWORK: CLIENT SIDE -->
  <rect x="35" y="80" width="320" height="290" class="panel"/>
  <text x="55" y="106" class="section-title">NETWORK - CLIENT SIDE</text>

  <rect x="60" y="130" width="115" height="55" class="client"/>
  <text x="78" y="153" class="box-title">ClientApp</text>
  <text x="78" y="171" class="box-text">starts client</text>

  <rect x="215" y="130" width="115" height="55" class="client"/>
  <text x="232" y="153" class="box-title">ClientController</text>
  <text x="232" y="171" class="box-text">message routing</text>

  <rect x="215" y="215" width="115" height="55" class="client"/>
  <text x="232" y="238" class="box-title">ServerProxy</text>
  <text x="232" y="256" class="box-text">transport facade</text>

  <rect x="60" y="300" width="115" height="55" class="client"/>
  <text x="78" y="323" class="box-title">SocketProxy</text>
  <text x="78" y="341" class="box-text">JSON lines</text>

  <rect x="215" y="300" width="115" height="55" class="client"/>
  <text x="232" y="323" class="box-title">RmiProxy</text>
  <text x="232" y="341" class="box-text">RmiClient callback</text>

  <path d="M175 158 L215 158" class="line"/>
  <path d="M273 185 L273 215" class="line"/>
  <path d="M245 270 L145 300" class="line"/>
  <path d="M273 270 L273 300" class="line"/>

  <!-- TRANSPORT -->
  <rect x="385" y="80" width="230" height="290" class="panel"/>
  <text x="405" y="106" class="section-title">TRANSPORT BOUNDARY</text>

  <rect x="415" y="145" width="170" height="70" class="transport"/>
  <text x="435" y="168" class="box-title">Socket TCP</text>
  <text x="435" y="187" class="box-text">one UTF-8 JSON Message</text>
  <text x="435" y="203" class="box-text">per line</text>

  <rect x="415" y="260" width="170" height="80" class="transport"/>
  <text x="435" y="283" class="box-title">RMI</text>
  <text x="435" y="302" class="box-text">RmiServer registration</text>
  <text x="435" y="318" class="box-text">RmiPlayerSession actions</text>
  <text x="435" y="334" class="box-text">RmiClient JSON callback</text>

  <path d="M175 328 L415 180" class="line"/>
  <path d="M330 328 L415 300" class="line"/>

  <!-- NETWORK: SERVER SIDE -->
  <rect x="645" y="80" width="810" height="290" class="panel"/>
  <text x="665" y="106" class="section-title">NETWORK - SERVER SIDE</text>

  <rect x="675" y="130" width="105" height="55" class="server"/>
  <text x="692" y="153" class="box-title">ServerApp</text>
  <text x="692" y="171" class="box-text">CLI entrypoint</text>

  <rect x="810" y="130" width="105" height="55" class="server"/>
  <text x="827" y="153" class="box-title">GameServer</text>
  <text x="827" y="171" class="box-text">starts services</text>

  <rect x="945" y="130" width="125" height="55" class="server"/>
  <text x="962" y="153" class="box-title">LobbyServer</text>
  <text x="962" y="171" class="box-text">sessions, nicknames</text>

  <rect x="1100" y="130" width="120" height="55" class="server"/>
  <text x="1117" y="153" class="box-title">RmiServerImpl</text>
  <text x="1117" y="171" class="box-text">registry service</text>

  <rect x="675" y="240" width="135" height="60" class="server"/>
  <text x="692" y="263" class="box-title">SocketHandler</text>
  <text x="692" y="282" class="box-text">reader, writer, watchdog</text>

  <rect x="845" y="240" width="135" height="60" class="server"/>
  <text x="862" y="263" class="box-title">RmiClientHandler</text>
  <text x="862" y="282" class="box-text">per-player session</text>

  <rect x="1015" y="240" width="135" height="60" class="server"/>
  <text x="1032" y="263" class="box-title">ClientConnection</text>
  <text x="1032" y="282" class="box-text">transport adapter</text>

  <rect x="1185" y="240" width="135" height="60" class="server"/>
  <text x="1202" y="263" class="box-title">GameSession</text>
  <text x="1202" y="282" class="box-text">routes, broadcasts</text>

  <rect x="1345" y="240" width="80" height="60" class="server"/>
  <text x="1363" y="263" class="box-title">Message</text>
  <text x="1363" y="282" class="box-text">JSON</text>

  <path d="M780 158 L810 158" class="line"/>
  <path d="M915 158 L945 158" class="line"/>
  <path d="M1070 158 L1100 158" class="line"/>
  <path d="M585 180 L675 270" class="line"/>
