  <rect x="800" y="825" width="655" height="60" class="panel"/>
  <text x="820" y="852" class="section-title">OBSERVER SNAPSHOTS AND LEADERBOARD</text>
  <text x="820" y="872" class="label">GameEvent, BoardSnapshot, PlayerSnapshot, CardSnapshot, FinalScoreBreakdown, LeaderboardRepository</text>

